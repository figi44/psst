# The eval server: what `psst-eval audio` runs in-process, and what replay recomputes
# each case's engine request from. Every key not set here takes its default, so
# the eval follows the production model and options; changing them, here or in psst-config, means
# re-running the audio eval. Those defaults are what the engine benchmarks chose: large-v3-turbo,
# int8_float16, and the options below.
#
#   [model.options]
#   path = "batched"
#   beam_size = 5
#   word_timestamps = true
#   vad_filter = true
#   terms_as = "prompt"
#   batch_size = 8

# Accept `start.eval` (`bias = false` for the raw traces) and send the trace with every `final`.
eval_mode = true
# Only the socket psst-eval passes in: no TCP port that could clash with a running server.
listen = []

[model]
# The engine from this worktree, with the CUDA package's Python (`nix develop .#gpu`).
command = ["psst-engine-dev"]
