# Fixed dictionary snapshot for the eval set (plan 7.3).
#
# It's large on purpose: the bias terms (pinned first, then the rest alphabetically) overflow the 223-token budget
# for style plus terms (plan 5.3), so evals exercise dropping terms from the end. Every [[Term]] in
# evals/sentences/*.txt must be here (scripts/synth-evals.sh checks it). Changing this file means re-running the audio
# eval (plan 7.3).
#
# The format is docs/config.md's. Defaults: sounds_like = [], languages = "any" ("en" or "cs" restricts a term),
# fuzzy = true (English only), pin = false.
#
# sounds_like holds spellings Whisper actually produced for these terms during Phase 0. Common words that a term
# sounds like (Traefik → "traffic", Flox → "flocks") are left out on purpose: as exact spellings they would rewrite
# every ordinary use of the word.

# --- pinned: always in the prompt --------------------------------------------------------------------------------

[[terms]]
text = "psst"
sounds_like = ["pst", "P S S T", "PSSSD"]
pin = true
notes = "this project"

