# Fixed profiles snapshot for the eval set, in the server's profiles.toml format. The engine
# benchmarks in scripts/bench/ take the bias style (prompt_style) from here too.

[profiles.default]
language = "en"
prompt_style = "I'm updating the NixOS config. Claude Code and t3code run fine."
rules = ["fillers", "whitespace", "capitalize", "trailing_space"]

[profiles.czech]
language = "cs"
prompt_style = "Upravuji konfiguraci NixOS a spouštím t3code."
rules = ["fillers", "whitespace", "capitalize", "trailing_space"]

[fillers]
en = ["um", "uh", "erm"]
cs = ["ehm", "eee"]
