{% extends "base.html" %}
{% block title %}Log in · psst{% endblock %}
{% block main %}
<section class="card narrow">
  <h1>Log in to psst</h1>
  <form id="login" method="post" action="/api/login/redeem">
    <input type="hidden" name="token" value="{{ token }}">
    <button type="submit">Log in</button>
  </form>
  <p class="hint">The link works once, within a minute of <code>psst ui</code>.</p>
</section>
<script src="/static/login.js?v={{ assets }}"></script>
{% endblock %}
