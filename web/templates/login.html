{% extends "base.html" %}
{% block title %}Log in · psst{% endblock %}
{% block solo %}
<main class="solo">
  <form class="solo-in" id="login" method="post" action="/api/login/redeem">
    <a class="brand" href="/history">psst<i aria-hidden="true"></i></a>
    <h1>Logging you in…</h1>
    <input type="hidden" name="token" value="{{ token }}">
    <p>If nothing happens, log in here:</p>
    <div class="actions"><button class="btn primary" type="submit">Log in</button></div>
    <p class="hint">The link works once, within a minute of <code>psst ui</code>.</p>
  </form>
</main>
<script src="/static/login.js?v={{ assets }}"></script>
{% endblock %}
