org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# The ABIs libpsst_android.so is built for: arm64-v8a for phones, x86_64 for the emulator.
psst.abis=arm64-v8a,x86_64
# The android shell's aapt2FromMavenOverride, without which AGP's aapt2 can't run on NixOS.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
