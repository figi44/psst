[project]
name = "psst-engine-faster-whisper"
version = "0.1.0"
description = "faster-whisper engine for the psst dictation server"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
# faster-whisper is added with the real model; the protocol and request loop use only the standard library.
dependencies = []

[project.scripts]
psst-engine-faster-whisper = "psst_engine_faster_whisper.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["psst_engine_faster_whisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
