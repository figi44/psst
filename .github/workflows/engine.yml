name: Engine

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml
    with:
      paths: |
        engines/*
        flake.nix
        flake.lock
        .github/workflows/engine.yml
        .github/workflows/changes.yml

  pytest:
    name: pytest
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: pytest
        working-directory: engines/faster-whisper
        run: nix shell --inputs-from ../.. nixpkgs#python3Packages.pytest --command pytest
      - name: Golden frames match the committed ones
        run: git diff --exit-code -- engines/faster-whisper/tests/golden
