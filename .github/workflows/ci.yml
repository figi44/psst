# fmt, clippy, tests, the Rust half of the golden frames, and the flake. Everything runs in the
# flake's dev shell, so CI uses exactly the toolchain agents use locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check the flake
        run: nix flake check --no-build
      - name: Enter the dev shell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      # Only main saves the cache. A pull request's cache is visible only to that pull request,
      # pushes main's out of the 10 GB limit, and its later runs restore it over main's newer one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --profile ci
      - name: Golden frames match the committed ones
        run: git diff --exit-code -- engines/faster-whisper/tests/golden
