[package]
name = "psst-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
psst = { version = "0.1.0", path = "../psst" }
psst-server = { version = "0.1.0", path = "../psst-server" }
psst-testkit = { version = "0.1.0", path = "../psst-testkit" }
rustix = { version = "1.1.6", features = ["time"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.15"

[dev-dependencies]
futures-util = "0.3.34"
nix = { version = "0.31.3", features = ["signal", "user"] }
psst-client = { path = "../psst-client" }
psst-config = { path = "../psst-config" }
psst-engine-proto = { path = "../psst-engine-proto" }
psst-proto = { path = "../psst-proto" }
psst-wayland = { path = "../psst-wayland" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = "0.29"
uuid = { version = "1.29.0", features = ["v4"] }

[[bin]]
name = "psst-server-e2e"
path = "src/bin/psst-server-e2e.rs"
test = false

[[bin]]
name = "psst-e2e-daemon"
path = "src/bin/psst-e2e-daemon.rs"
test = false

[[bin]]
name = "psst-paste-target"
path = "src/bin/psst-paste-target.rs"
test = false
