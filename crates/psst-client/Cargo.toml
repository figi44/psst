[package]
name = "psst-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
httparse = "1.10.1"
opusic-c = { version = "1.6.1", default-features = false }
psst-proto = { version = "0.1.0", path = "../psst-proto" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "macros", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
psst-testkit = { path = "../psst-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }
uuid = { version = "1.29.0", features = ["v4"] }
