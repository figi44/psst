[package]
name = "psst-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
psst-config = { version = "0.1.0", path = "../psst-config" }
psst-engine-proto = { version = "0.1.0", path = "../psst-engine-proto" }
psst-proto = { version = "0.1.0", path = "../psst-proto" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = "1.2.1"
uuid = "1.29.0"
