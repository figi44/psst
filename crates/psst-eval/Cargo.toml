[package]
name = "psst-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
claxon = "0.4.3"
psst-client = { version = "0.1.0", path = "../psst-client" }
psst-config = { version = "0.1.0", path = "../psst-config" }
psst-dict = { version = "0.1.0", path = "../psst-dict" }
psst-engine-proto = { version = "0.1.0", path = "../psst-engine-proto" }
psst-pipeline = { version = "0.1.0", path = "../psst-pipeline" }
psst-proto = { version = "0.1.0", path = "../psst-proto" }
psst-server = { version = "0.1.0", path = "../psst-server" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4"] }
