[package]
name = "psst-android"
description = "psst's Android client core: the dictation logic the app drives over JNI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22.4"
psst-client = { version = "0.1.0", path = "../psst-client" }
psst-proto = { version = "0.1.0", path = "../psst-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
opusic-c = { version = "1.6.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
psst-testkit = { path = "../psst-testkit" }
tempfile = "3.27.0"
