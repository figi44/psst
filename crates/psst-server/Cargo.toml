[package]
name = "psst-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jiff = "0.2.39"
minijinja = { version = "3.0.5", features = ["serde", "urlencode"] }
nix = { version = "0.31.3", features = ["user", "signal", "process", "fs"] }
opusic-c = { version = "1.6.1", default-features = false }
psst-config = { version = "0.1.0", path = "../psst-config" }
psst-dict = { version = "0.1.0", path = "../psst-dict" }
psst-engine-proto = { version = "0.1.0", path = "../psst-engine-proto" }
psst-pipeline = { version = "0.1.0", path = "../psst-pipeline" }
psst-proto = { version = "0.1.0", path = "../psst-proto" }
rand = "0.10.3"
rusqlite = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
